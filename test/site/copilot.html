<!doctype html><html><head><meta charset="utf-8"><title>copilot test</title>
<link rel="stylesheet" href="/site.css"></head>
<body><h1>Copilot-style stand-in</h1>
<main>
  <h2>A rich-text box with hidden text after the words (as Copilot's message box has)</h2>
  <div id="note" contenteditable="true"><p><span>Call Greta Holm</span><span aria-hidden="true">&#8203;&#8204;</span></p></div>
  <h2>Message box</h2>
  <div id="m365-chat-input-shared-container">
    <div class="input-bar">
      <button type="button" data-testid="PlusMenuButton" aria-label="Add and manage sources">+</button>
      <span class="editor-wrap"><span id="m365-chat-editor-target-element" class="fai-EditorInput__input" role="textbox"
        contenteditable="true" aria-label="Message Copilot" aria-placeholder="Message Copilot"></span></span>
      <span id="send-slot"></span>
    </div>
  </div>
  <div class="suggestions"><button type="button">Explore</button><button type="button">Shop</button></div>
</main>
<script src="/copilot.bundle.js"></script></body></html>
